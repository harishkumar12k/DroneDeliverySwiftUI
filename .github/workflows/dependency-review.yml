# ==============================================================================
# GitHub Actions Workflow: Dependency Review
# ==============================================================================
# Scans incoming Pull Requests for newly added or upgraded dependencies that
# contain known security vulnerabilities, malicious packages, or incompatible licenses.
# Docs: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review
# ==============================================================================

name: "Dependency Review"

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan PR Dependencies for Known Vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          # Fails the PR check if a new dependency has moderate, high, or critical vulnerabilities
          fail-on-severity: moderate
