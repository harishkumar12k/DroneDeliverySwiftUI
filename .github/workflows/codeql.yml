# ==============================================================================
# GitHub Actions Workflow: CodeQL Static Application Security Testing (SAST)
# ==============================================================================
# This workflow scans your Swift codebase for vulnerabilities and code quality issues:
# 1. On Pull Requests targeting 'main' (catches bugs BEFORE merge)
# 2. When merged/pushed into 'main' (keeps 'main' security baseline verified)
# ==============================================================================

name: "CodeQL Analysis"

# ------------------------------------------------------------------------------
# Triggers: When should this workflow run?
# ------------------------------------------------------------------------------
on:
  push:
    # Runs when code is merged into 'main'
    branches: [ "main" ]
  pull_request:
    # Runs on PRs targeting 'main' so you see alerts before merging
    branches: [ "main" ]

# ------------------------------------------------------------------------------
# Concurrency: Avoid redundant CI runs
# ------------------------------------------------------------------------------
# Cancels in-progress runs on the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ------------------------------------------------------------------------------
# Jobs: The actual tasks to execute
# ------------------------------------------------------------------------------
jobs:
  analyze:
    name: Analyze (Swift)
    
    # Swift compilation requires macOS with Xcode and developer toolchains installed.
    runs-on: macos-15
    
    # Cancel the job if it takes longer than 60 minutes
    timeout-minutes: 60

    # Permissions required by CodeQL to upload scanning results to GitHub Security tab
    # and annotate Pull Requests with findings
    permissions:
      security-events: write # Allows writing alerts into GitHub's "Security" tab & PR checks
      packages: read         # Allows reading packages if dependencies require it
      actions: read          # Allows reading workflow actions
      contents: read         # Allows checking out (cloning) the repository code

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            # Using manual build mode ensures xcodebuild targets the project in DroneDelivery-iOS/
            build-mode: manual

    steps:
      # Step 1: Check out the repository source code to the GitHub Actions runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Initialize the CodeQL database and load analysis query suites
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-extended,security-and-quality

      # Step 3: Explicitly build the Xcode project located inside DroneDelivery-iOS folder
      - name: Build Xcode Project
        working-directory: DroneDelivery-iOS
        run: |
          xcodebuild clean build \
            -project DroneDelivery-iOS.xcodeproj \
            -scheme DroneDelivery-iOS \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Step 4: Extract the compiled Swift AST/database and run the security queries
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
